name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pillow requests pyyaml pytest ruff
      - run: ruff check apps tests
      - run: pytest -q

  firmware-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch applies to glimmer
        run: |
          git clone --quiet https://github.com/Avinava/glimmer.git /tmp/glimmer
          cd /tmp/glimmer && git checkout --quiet bf7fba4
          git apply --check "$GITHUB_WORKSPACE/firmware/glimmer-pixel-channel.patch"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build
        run: |
          pip install platformio
          cd /tmp/glimmer && git apply "$GITHUB_WORKSPACE/firmware/glimmer-pixel-channel.patch"
          pio run -e nodemcuv2
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: /tmp/glimmer/.pio/build/nodemcuv2/firmware.bin
