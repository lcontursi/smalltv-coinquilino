# Da copiare in apps/apps.yaml di AppDaemon (o in un qualunque file .yaml dentro apps/).
# Un'istanza per cubo. Le impostazioni comuni stanno in coinquilino_personale.yaml;
# quelle scritte qui vincono, quindi qui va solo cio' che cambia da un cubo all'altro.

coinquilino:
  module: coinquilino
  class: Coinquilino
