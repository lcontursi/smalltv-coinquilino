[project]
name = "smalltv-coinquilino"
version = "3.1.0"
description = "An animated roommate for Home Assistant on a GeekMagic SmallTV Ultra (AppDaemon app)"
requires-python = ">=3.11"
dependencies = ["pillow>=10", "requests>=2.28", "pyyaml>=6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# disegni: piu' istruzioni corte su una riga e nomi brevi (l = riga) restano leggibili
ignore = ["E702", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
